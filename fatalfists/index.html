<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fatal Fists · Coming soon</title>
<meta name="description" content="A one-on-one arcade fighting game. Coming soon.">
<style>
:root{color-scheme:dark;--bg:#140708;--ink:#f1eceb;--dim:#a8938f;--accent:#ff3b2f}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px 16px}
svg{width:min(300px,80vw);height:auto;display:block;margin:0 auto 24px}
h1{margin:0;font-size:2rem;letter-spacing:.08em;text-transform:uppercase}
.tag{display:inline-block;margin:10px 0 18px;padding:3px 12px;border-radius:99px;background:var(--accent);color:#1a0403;font-weight:700;font-size:.8rem;letter-spacing:.12em}
p{color:var(--dim);max-width:420px;margin:0 auto 8px;line-height:1.5}
a{color:var(--accent)}
.back{display:inline-block;margin-top:24px}
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 160 110" aria-hidden="true">
    <circle cx="80" cy="46" r="34" fill="#3a0d0c"/>
    <rect x="0" y="92" width="160" height="4" fill="#3a1614"/>
    <!-- left fighter -->
    <g fill="#ffcf5a">
      <circle cx="46" cy="34" r="7"/>
      <path d="M40 43h12l3 24h-18z"/>
      <path d="M52 46l20 -3v6l-19 4z"/>
      <path d="M38 67h8l-6 25h-8z"/>
      <path d="M47 67h8l8 25h-8z"/>
    </g>
    <!-- right fighter -->
    <g fill="#ff3b2f">
      <circle cx="114" cy="34" r="7"/>
      <path d="M108 43h12l3 24h-18z"/>
      <path d="M108 46l-20 -3v6l19 4z"/>
      <path d="M114 67h8l6 25h-8z"/>
      <path d="M105 67h8l-8 25h-8z"/>
    </g>
    <!-- clash spark -->
    <path d="M80 34l3 8 8 -2 -6 6 6 6 -8 -2 -3 8 -3 -8 -8 2 6 -6 -6 -6 8 2z" fill="#fff"/>
  </svg>
  <h1>Fatal Fists</h1>
  <div class="tag">COMING SOON</div>
  <p>A one-on-one arcade fighter: punches, kicks, blocks and special moves, best of three rounds.</p>
  <p>Fight the computer or a friend on the same keyboard.</p>
  <a class="back" href="/games/">&larr; Back to the games</a>
</main>
</body>
</html>
