<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hex Isles · Coming soon</title>
<meta name="description" content="A multiplayer island-building board game. Coming soon.">
<style>
:root{color-scheme:dark;--bg:#0b1620;--ink:#ecefed;--dim:#8b9aa3;--accent:#ffcf5a}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;text-align:center;padding:24px 16px}
svg{width:min(280px,80vw);height:auto;display:block;margin:0 auto 24px}
h1{margin:0;font-size:2rem;letter-spacing:.02em}
.tag{display:inline-block;margin:10px 0 18px;padding:3px 12px;border-radius:99px;background:var(--accent);color:#1a1405;font-weight:700;font-size:.8rem;letter-spacing:.12em}
p{color:var(--dim);max-width:420px;margin:0 auto 8px;line-height:1.5}
a{color:var(--accent)}
.back{display:inline-block;margin-top:24px}
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 160 140" aria-hidden="true">
    <g stroke="#0b1620" stroke-width="3">
      <polygon points="80,10 104,24 104,52 80,66 56,52 56,24" fill="#3f8f3a"/>
      <polygon points="52,52 76,66 76,94 52,108 28,94 28,66" fill="#d9b44a"/>
      <polygon points="108,52 132,66 132,94 108,108 84,94 84,66" fill="#8a8f96"/>
      <polygon points="80,94 104,108 104,136 80,150 56,136 56,108" fill="#b5532f" transform="translate(0,-12)"/>
    </g>
  </svg>
  <h1>Hex Isles</h1>
  <div class="tag">COMING SOON</div>
  <p>Build roads and towns on a hex island, trade with friends, race to 10 points.</p>
  <p>Multiplayer over wifi: one player hosts, everyone else joins with a room code.</p>
  <a class="back" href="/games/">&larr; Back to the games</a>
</main>
</body>
</html>
